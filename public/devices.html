<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title data-t="page.title.devices"></title>
  <meta name="theme-color" content="#2f6feb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Portboard">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="shell.css">
  <link rel="stylesheet" href="devices.css">
  <!--#shell:boot-->
</head>
<body data-view="devices">
  <!-- The shell: the server fills in each shell marker (src/core/shell.ts) and lib/shell.js wires it. -->
  <header class="top">
    <div class="brand">
      <!--#shell:nav-->
      <h1 id="shellTitle" class="shell-title"><!--#shell:view--><span class="t-ctx" id="shellCtx"></span></h1>
    </div>
    <!--#shell:tabs-->
    <div class="controls">
      <!--#shell:palette-->
      <button id="alertsBtn" type="button" class="alerts-btn" data-t-title="page.alerts" data-t-aria-label="page.alerts">🔔<span id="alertsCount" class="count-pill"></span></button>
      <button id="refresh" type="button" data-t-title="common.refresh">↻</button>
      <!--#shell:insp-toggle-->
    </div>
  </header>
  <div class="shell">
    <!--#shell:sidebar-->
    <div class="shell-main" id="shellMain">
    <main class="dev-main" data-wait="page">
      <h2 id="headline" class="headline"></h2>
      <p id="status" class="status" aria-live="polite"></p>

      <section id="newDevs" class="new-devs" data-t-aria-label="page.devices.newDevs" hidden></section>

      <div class="view-switch" role="group" data-t-aria-label="page.devices.view">
        <button type="button" id="viewTree" class="seg" data-view-mode="tree" aria-pressed="true" data-t="page.devices.tree"></button>
        <button type="button" id="viewCards" class="seg" data-view-mode="cards" aria-pressed="false" data-t="page.devices.cards"></button>
      </div>
      <section id="netTree" class="net-tree tree-only" data-t-aria-label="page.devices.netTree"></section>

      <section id="active" class="cards cards-only" data-t-aria-label="page.devices.active"></section>

      <p id="pveHint" class="pve-hint" hidden></p>
      <p id="pvePortsHint" class="pve-hint" hidden></p>
      <p id="winPortsHint" class="pve-hint" hidden></p>

      <h3 class="sec-h cards-only" data-t="common.thisServer"></h3>
      <section id="self" class="cards one cards-only" data-t-aria-label="common.thisServer"></section>

      <h3 class="sec-h cards-only" id="idleH"></h3>
      <section id="idle" class="idle-chips cards-only" data-t-aria-label="page.devices.idle"></section>

      <h3 class="sec-h" id="idleSvcH"></h3>
      <ul id="idleSvcList" class="uses idle-svc-list" data-t-aria-label="page.devices.idleSvc.list"></ul>
      <a id="idleSvc" class="idle-svc" href="./" data-t="page.devices.idleSvc"></a>

      <h3 class="sec-h" data-t="page.devices.nd"></h3>
      <section id="ndSettings" class="nd-settings" data-t-aria-label="page.devices.nd.settings"></section>

      <p class="pve-hint"><a href="settings.html#remote" data-t="page.devices.remoteMoved"></a></p>
    </main>
    </div>
    <!--#shell:aside-->
  </div>

  <aside id="detail" class="detail" hidden aria-live="polite">
    <button type="button" class="detail-close" id="detailClose" data-t-aria-label="common.close">×</button>
    <div id="detailBody"></div>
  </aside>

  <div id="toast" class="toast" role="status" hidden></div>

  <script src="devices.js" type="module"></script>
</body>
</html>

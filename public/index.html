<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Portboard</title>
  <meta name="theme-color" content="#2f6feb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Portboard">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="shell.css">
  <!--#shell:boot-->
</head>
<body data-view="services" data-inspector>
  <!-- The shell: the server fills in each shell marker (src/core/shell.ts) and lib/shell.js wires it. -->
  <header class="top">
    <div class="brand">
      <!--#shell:nav-->
      <h1 id="shellTitle" class="shell-title"><!--#shell:view--><span class="t-ctx" id="shellCtx"><span id="host" class="host"><span data-t="common.thisServer"></span> <!--#shell:hostname--></span><select id="hostSel" data-t-title="page.services.hostSel.title" data-t-aria-label="page.services.hostSel" hidden></select></span></h1>
    </div>
    <!--#shell:tabs-->
    <div class="controls">
      <!--#shell:palette-->
      <div class="filter-pop" id="filterPop">
        <!--#shell:filter-->
        <div class="menu-panel filter-panel" id="filterPanel">
          <input id="q" type="search" data-t-placeholder="page.services.q" autocomplete="off">
          <label class="check" data-t-title="page.services.inUse.title"><input id="inUse" type="checkbox"> <span data-t="page.services.inUse"></span><span id="inUseCount" class="count-pill"></span></label>
          <label class="check" data-t-title="page.services.all.title"><input id="showSystem" type="checkbox"> <span data-t="page.services.all"></span></label>
        </div>
      </div>
      <button id="alertsBtn" type="button" class="alerts-btn" data-t-title="page.alerts" data-t-aria-label="page.alerts">🔔<span id="alertsCount" class="count-pill"></span></button>
      <button id="refresh" type="button" data-t-title="common.refresh">↻</button>
      <!--#shell:insp-toggle-->
    </div>
  </header>
  <div class="shell">
    <!--#shell:sidebar-->
    <div class="shell-main" id="shellMain">
    <p id="status" class="status" aria-live="polite"></p>

    <main data-wait="page owners alerts">
      <section id="devices" class="devices" data-t-aria-label="page.services.devices" hidden></section>
      <ul id="list" class="list"></ul>
      <section id="remote" class="remote" aria-live="polite" hidden></section>
      <p id="empty" class="empty" data-t="page.services.empty" hidden></p>
    </main>
    </div>
    <!--#shell:aside-->
  </div>

  <div id="toast" class="toast" role="status" hidden></div>

  <dialog id="logs" class="logs">
    <header>
      <div>
        <strong id="logsTitle"></strong>
        <div id="logsSource" class="logs-source"></div>
      </div>
      <div class="logs-controls">
        <select id="logsLines" data-t-aria-label="page.logs.lines">
          <option value="100" data-t="page.logs.100"></option>
          <option value="300" data-t="page.logs.300"></option>
          <option value="1000" data-t="page.logs.1000"></option>
        </select>
        <button type="button" id="logsRefresh" data-t-title="common.refresh">↻</button>
        <button type="button" id="logsClose" data-t="common.close"></button>
      </div>
    </header>
    <pre id="logsBody"></pre>
  </dialog>

  <template id="row">
    <li class="row">
      <div class="port"></div>
      <div class="main">
        <div class="name-line">
          <button type="button" class="pin" data-t-aria-label="page.row.pin" data-write="1"></button>
          <a class="name"></a>
        </div>
        <div class="meta"></div>
        <div class="badges"></div>
      </div>
      <div class="actions"></div>
      <details class="more">
        <summary data-t="page.row.more"></summary>
        <dl></dl>
      </details>
    </li>
  </template>

  <script src="app.js" type="module"></script>
</body>
</html>

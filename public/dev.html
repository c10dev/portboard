<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title data-t="page.title.dev"></title>
  <meta name="theme-color" content="#2f6feb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Portboard">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="shell.css">
  <link rel="stylesheet" href="dev.css">
  <!--#shell:boot-->
</head>
<body data-view="dev">
  <!-- The shell: the server fills in each shell marker (src/core/shell.ts) and lib/shell.js wires it. -->
  <header class="top">
    <div class="brand">
      <!--#shell:nav-->
      <h1 id="shellTitle" class="shell-title"><!--#shell:view--><span class="t-ctx" id="shellCtx"></span></h1>
    </div>
    <!--#shell:tabs-->
    <div class="controls">
      <!--#shell:palette-->
      <div class="filter-pop" id="filterPop">
        <!--#shell:filter-->
        <div class="menu-panel filter-panel" id="filterPanel">
          <label class="check"><input id="onlyRemovable" type="checkbox"> <span data-t="page.dev.onlyRemovable"></span></label>
        </div>
      </div>
      <button id="rescan" type="button" data-t-title="page.dev.rescan.title" data-t-aria-label="page.dev.rescan">↻</button>
      <!--#shell:insp-toggle-->
    </div>
  </header>
  <div class="shell">
    <!--#shell:sidebar-->
    <div class="shell-main" id="shellMain">
    <main class="wt-main" data-wait="page">
      <h2 id="headline" class="headline"></h2>
      <p id="status" class="status" aria-live="polite"></p>
      <p class="wt-help" data-th="page.dev.help"></p>
      <section class="resv" data-t-aria-label="page.dev.resv">
        <h3 data-t="page.dev.resv"></h3>
        <p class="wt-help" data-th="page.dev.resv.help"></p>
        <form id="resvForm" class="resv-form">
          <input id="resvOwner" required maxlength="120" data-t-placeholder="page.dev.resv.owner">
          <input id="resvPort" type="number" min="1024" max="65535" data-t-placeholder="page.dev.resv.port">
          <input id="resvNote" maxlength="200" data-t-placeholder="page.dev.resv.note">
          <button type="submit" class="btn primary" data-write="1" data-t="page.dev.resv.submit"></button>
        </form>
        <ul id="resvList" class="resv-list"></ul>
      </section>

      <h3 class="wt-h" data-t="page.dev.worktrees"></h3>
      <section id="repos" data-t-aria-label="page.dev.repos"></section>
    </main>
    </div>
    <!--#shell:aside-->
  </div>

  <div id="toast" class="toast" role="status" hidden></div>

  <script src="dev.js" type="module"></script>
</body>
</html>

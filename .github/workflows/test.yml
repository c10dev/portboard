name: test

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: the job only checks out and tests (docs/security-review/v1.0.md I10)
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions pinned by commit SHA (the tag they were at, after #)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      # Runtime has zero dependencies; TypeScript and @types/node are dev-only, for the typecheck.
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      # Tests use fixtures; anything that shells out to ss, tailscale or docker must cope with them missing.
      - run: npm test

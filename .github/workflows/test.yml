name: test

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: the job only checks out and tests (docs/security-review/v1.0.md I10)
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions pinned by commit SHA (the tag they were at, after #)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      # Runtime has zero dependencies; TypeScript and @types/node are dev-only, for the typecheck.
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      # public/ JS: only files that opt in with // @ts-check (tsconfig.public.json, CONTRIBUTING.md)
      - run: npm run typecheck:public
      # Tests use fixtures; anything that shells out to ss, tailscale or docker must cope with them missing.
      - run: npm test
      # The same suite in English, minus the files that assert Korean wording (scripts/test-en.ts)
      - run: npm run test:en
      # The Go binary in shim/ (docs/claude-plugin/README.md): standard library only, so nothing to download or cache.
      # Its tests build the binary and run the shared contract cases against it, with the node set up above.
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: shim/go.mod
          cache: false
      - run: cd shim && go vet ./... && go test ./...

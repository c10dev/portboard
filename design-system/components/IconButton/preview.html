<!-- @dsCard group="Actions" height=110 subtitle="sidebar toggle open and closed with attention dot, back, forward, disabled, details panel on and off, close" -->
<style>
  .ds-stage { display: flex; flex-direction: column; gap: 18px; padding: 20px; background: var(--bg); color: var(--text); }
  .ds-row { display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start; }
  .ds-cell { display: flex; flex-direction: column; align-items: center; gap: 8px; min-width: 72px; }
  .ds-cap { font-size: var(--fs-1); color: var(--muted); text-align: center; }
  .ds-bar { display: flex; align-items: center; gap: 2px; }
</style>
<!-- the attention dot on a closed sidebar toggle shows when the sidebar footer has a chip in the warn state -->
<button type="button" class="sw-chip warn" id="swChip" aria-label="Data collection status" hidden><span class="sw-dot"></span><span class="sw-text" id="swText"></span></button>
<div class="ds-stage">
  <div class="ds-row">
    <div class="ds-cell">
      <div class="ds-bar">
        <button type="button" id="sideToggle" class="icon-btn side-toggle" title="Sidebar (⌘\)" aria-label="Sidebar (⌘\)" aria-controls="shellSide" aria-keyshortcuts="Meta+\ Control+\" aria-expanded="true"><svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><rect x="2.5" y="3.5" width="15" height="13" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 3.5v13" stroke="currentColor" stroke-width="1.5"/></svg></button>
      </div>
      <span class="ds-cap">Sidebar, open</span>
    </div>
    <div class="ds-cell">
      <div class="ds-bar">
        <button type="button" class="icon-btn side-toggle" title="Sidebar (⌘\)" aria-label="Sidebar (⌘\)" aria-controls="shellSide" aria-keyshortcuts="Meta+\ Control+\" aria-expanded="false"><svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><rect x="2.5" y="3.5" width="15" height="13" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 3.5v13" stroke="currentColor" stroke-width="1.5"/></svg></button>
      </div>
      <span class="ds-cap">Sidebar, closed<br>with attention dot</span>
    </div>
    <div class="ds-cell">
      <div class="ds-bar">
        <button type="button" id="navBack" class="icon-btn nav-btn" title="Back (⌘[)" aria-label="Back">←</button>
        <button type="button" id="navFwd" class="icon-btn nav-btn" title="Forward (⌘])" aria-label="Forward">→</button>
      </div>
      <span class="ds-cap">Back, Forward</span>
    </div>
    <div class="ds-cell">
      <div class="ds-bar">
        <button type="button" class="icon-btn nav-btn" title="Back (⌘[)" aria-label="Back" disabled>←</button>
        <button type="button" class="icon-btn nav-btn" title="Forward (⌘])" aria-label="Forward" disabled>→</button>
      </div>
      <span class="ds-cap">Disabled</span>
    </div>
    <div class="ds-cell">
      <div class="ds-bar">
        <button type="button" id="inspToggle" class="icon-btn insp-toggle" title="Details panel" aria-label="Details panel" aria-controls="inspector" aria-pressed="true"><svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><rect x="2.5" y="3.5" width="15" height="13" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M12 3.5v13" stroke="currentColor" stroke-width="1.5"/></svg></button>
      </div>
      <span class="ds-cap">Details panel, on</span>
    </div>
    <div class="ds-cell">
      <div class="ds-bar">
        <button type="button" class="icon-btn insp-toggle" title="Details panel" aria-label="Details panel" aria-controls="inspector" aria-pressed="false"><svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><rect x="2.5" y="3.5" width="15" height="13" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M12 3.5v13" stroke="currentColor" stroke-width="1.5"/></svg></button>
      </div>
      <span class="ds-cap">Details panel, off</span>
    </div>
    <div class="ds-cell">
      <div class="ds-bar">
        <button type="button" id="inspClose" class="icon-btn" aria-label="Close details" title="Close">×</button>
      </div>
      <span class="ds-cap">Close</span>
    </div>
  </div>
</div>
